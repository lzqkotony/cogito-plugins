# ===== 经济（Vault）=====
# 注意：脑啡肽等物品的定义已经搬到同目录的 items.yml 里了
# 文本全部使用 MiniMessage 格式，支持 <gradient:#00ffaa:#3b82f6>...</gradient> 这类写法
economy:
  # 每 1 个脑啡肽需要多少钱（单向兑换，不可逆）
  price-per-enkephalin: 100
  # 单次最多兑换多少个
  max-per-exchange: 64

# ===== 箱子 GUI（/cogito gui）=====
gui:
  # 关掉之后 /cogito gui 会提示已关闭，命令行的 /exchange 不受影响
  enabled: true
  # 箱子标题，MiniMessage 格式
  title: "<gradient:#22d3a8:#3b82f6>脑啡肽箱子</gradient>"
  # 行数（每行 9 格）；界面按 5 行布局，写小于 5 会自动按 5 行处理
  rows: 5
  # 兑换按钮的档位，最多放 3 个；超过 max-per-exchange 的会被截断到上限
  exchange-amounts: [1, 8, 64]

# ===== 开发台（E.G.O. 研发）=====
develop:
  # 开发台界面标题
  title: "<gradient:#22d3a8:#facc15>开发台</gradient>"
  # 方块上方的全息文本
  hologram-text: "<gradient:#22d3a8:#facc15>开发台</gradient> <gray>· 右键研发"
  # 合成表开关（四角下界合金块 / 四边脑啡肽模块 / 中心工作台）
  table-recipe:
    enabled: true

# ===== 其它 =====
debug: false

# 玩家进服提示（留空则不发送）
join-message: ""
