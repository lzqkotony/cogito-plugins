# ===== 脑啡肽物品定义 =====
# 文本全部使用 MiniMessage 格式，支持 <gradient:#00ffaa:#3b82f6>...</gradient> 这类写法
enkephalin:
  material: EMERALD_BLOCK
  display-name: "<gradient:#22d3a8:#3b82f6>脑啡肽</gradient>"
  lore:
    - "<gray>从异想体中提取出的能量结晶"
    - "<dark_gray>可用于 E.G.O 开发"
  # 附魔只是为了让物品发光（默认隐藏附魔名，只保留光效）
  enchantment: unbreaking
  enchantment-level: 1
  hide-enchants: true
  glint: true
  # 以后加材质包时填 CustomModelData，0 表示不设置
  custom-model-data: 0
  # 数据标签名（命名空间是插件名，玩家无法伪造）
  tag: enkephalin

# ===== 经济（Vault）=====
economy:
  # 每 1 个脑啡肽需要多少钱（单向兑换，不可逆）
  price-per-enkephalin: 100
  # 单次最多兑换多少个
  max-per-exchange: 64

# ===== 箱子 GUI（/cogito gui）=====
gui:
  # 关掉之后 /cogito gui 会提示已关闭，命令行的 /exchange 不受影响
  enabled: true
  # 箱子标题，MiniMessage 格式
  title: "<gradient:#22d3a8:#3b82f6>脑啡肽箱子</gradient>"
  # 行数（每行 9 格）；界面按 5 行布局，写小于 5 会自动按 5 行处理
  rows: 5
  # 兑换按钮的档位，最多放 3 个；超过 max-per-exchange 的会被截断到上限
  exchange-amounts: [1, 8, 64]

# ===== 其它 =====
debug: false

# 玩家进服提示（留空则不发送）
join-message: ""
